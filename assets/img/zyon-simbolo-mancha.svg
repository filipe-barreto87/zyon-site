<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 80" role="img" aria-label="Zyon">
<!-- Símbolo sem a folga do grid 96: a mancha vive em x 6..90, y 8..88.
     A máscara continua resolvida no espaço original de 96u (grupo interno);
     o recorte acontece no grupo externo. -->
<defs>
    <mask id="furos">
      <rect width="96" height="96" fill="#fff"/>
      <rect x="40" y="17.5" width="16" height="5" rx="2.5" fill="#000"/>
      <rect x="40" y="45.5" width="16" height="5" rx="2.5" fill="#000" transform="rotate(-23 48 48)"/>
      <rect x="40" y="73.5" width="16" height="5" rx="2.5" fill="#000"/>
    </mask>
  </defs>
<g transform="translate(-6 -8)"><g mask="url(#furos)">
    <rect x="6" y="8" width="84" height="24" rx="2" fill="#F5EEE1"/>
    <path d="M62 36 H90 L34 60 H6 Z" fill="#E45D16"/>
    <rect x="6" y="64" width="84" height="24" rx="2" fill="#F5EEE1"/>
  </g></g>
</svg>
